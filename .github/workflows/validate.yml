name: Validate gateway image

on:
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - scripts/**
      - tests/**
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and run compatibility contracts
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=validate-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=validate-${{ matrix.runner }}
